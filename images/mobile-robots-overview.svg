<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three small robots in a row, connected by a dotted thread: a TurtleBot perceiving a box and cylinder, a TurtleBot following a walking person, and an F1TENTH racecar scanning with LIDAR while cornering">
  <defs>
    <linearGradient id="navyFillMR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a30" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f1221" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- shared dotted thread running behind all three robots -->
  <line x1="40" y1="195" x2="655" y2="195" stroke="#68e3ff" stroke-width="1.5" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.4"/>

  <!-- ===================== Robot 1: Active Perception ===================== -->
  <g transform="translate(50,70)">
    <!-- object detection FOV cone -->
    <polygon points="45,88 118,206 186,206" fill="#68e3ff" opacity="0.12" stroke="#68e3ff" stroke-width="1" stroke-opacity="0.32"/>

    <!-- ground objects: box and cylinder -->
    <rect x="118" y="188" width="22" height="18" rx="3" fill="url(#navyFillMR)" stroke="#8a6cff" stroke-width="1.3"/>
    <rect x="154" y="181" width="14" height="25" rx="7" fill="url(#navyFillMR)" stroke="#45ddb0" stroke-width="1.3"/>
    <ellipse cx="161" cy="181" rx="7" ry="3" fill="url(#navyFillMR)" stroke="#45ddb0" stroke-width="1.1"/>

    <!-- wheels -->
    <rect x="10" y="195" width="10" height="18" rx="3" fill="#0c0f1c" stroke="#8f9ab8" stroke-width="1"/>
    <rect x="70" y="195" width="10" height="18" rx="3" fill="#0c0f1c" stroke="#8f9ab8" stroke-width="1"/>

    <!-- body -->
    <rect x="6" y="140" width="78" height="65" rx="28" fill="url(#navyFillMR)" stroke="#68e3ff" stroke-width="1.5"/>

    <!-- camera stalk and head -->
    <line x1="45" y1="140" x2="45" y2="95" stroke="#c7cfe6" stroke-width="3" stroke-linecap="round"/>
    <rect x="31" y="78" width="28" height="20" rx="6" fill="url(#navyFillMR)" stroke="#68e3ff" stroke-width="1.5"/>
    <circle cx="45" cy="88" r="5" fill="#68e3ff" opacity="0.9"/>

    <!-- small coordinate axis triad at the camera -->
    <g transform="translate(63,68)" stroke-width="1.3" stroke-linecap="round">
      <line x1="0" y1="0" x2="11" y2="0" stroke="#ff5d5d"/>
      <line x1="0" y1="0" x2="0" y2="-11" stroke="#4ee08a"/>
      <line x1="0" y1="0" x2="8" y2="8" stroke="#5b9dff"/>
    </g>
  </g>

  <!-- ===================== Robot 2: Assistive Follower ===================== -->
  <g transform="translate(290,70)">
    <!-- dotted trail curving behind the person -->
    <circle cx="150" cy="207" r="3" fill="#68e3ff" opacity="0.55"/>
    <circle cx="118" cy="204" r="2.6" fill="#68e3ff" opacity="0.42"/>
    <circle cx="88" cy="198" r="2.2" fill="#68e3ff" opacity="0.3"/>
    <circle cx="64" cy="188" r="1.8" fill="#68e3ff" opacity="0.18"/>

    <!-- person silhouette -->
    <circle cx="155" cy="99" r="9" fill="#c7cfe6" opacity="0.75"/>
    <path d="M 144 113 L 166 113 L 161 160 L 149 160 Z" fill="#c7cfe6" opacity="0.7"/>
    <line x1="150" y1="160" x2="145" y2="206" stroke="#c7cfe6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="160" y1="160" x2="165" y2="206" stroke="#c7cfe6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- wheels -->
    <rect x="10" y="195" width="10" height="18" rx="3" fill="#0c0f1c" stroke="#8f9ab8" stroke-width="1"/>
    <rect x="70" y="195" width="10" height="18" rx="3" fill="#0c0f1c" stroke="#8f9ab8" stroke-width="1"/>

    <!-- body -->
    <rect x="6" y="140" width="78" height="65" rx="28" fill="url(#navyFillMR)" stroke="#45ddb0" stroke-width="1.5"/>

    <!-- camera stalk and head -->
    <line x1="45" y1="140" x2="45" y2="95" stroke="#c7cfe6" stroke-width="3" stroke-linecap="round"/>
    <rect x="31" y="78" width="28" height="20" rx="6" fill="url(#navyFillMR)" stroke="#45ddb0" stroke-width="1.5"/>
    <circle cx="45" cy="88" r="5" fill="#45ddb0" opacity="0.9"/>
  </g>

  <!-- ===================== Robot 3: F1TENTH racecar ===================== -->
  <g transform="translate(500,55)">
    <g transform="rotate(-7 75 140)">
      <!-- LIDAR scan arc, in the direction of travel -->
      <path d="M 84 106 L 150 78 A 66 66 0 0 1 150 172 Z" fill="#68e3ff" opacity="0.12" stroke="#68e3ff" stroke-width="1" stroke-opacity="0.32"/>

      <!-- wheels -->
      <circle cx="35" cy="154" r="11" fill="#0c0f1c" stroke="#8f9ab8" stroke-width="1"/>
      <circle cx="115" cy="154" r="11" fill="#0c0f1c" stroke="#8f9ab8" stroke-width="1"/>

      <!-- body -->
      <rect x="20" y="122" width="110" height="32" rx="14" fill="url(#navyFillMR)" stroke="#8a6cff" stroke-width="1.5"/>
      <ellipse cx="58" cy="120" rx="22" ry="9" fill="url(#navyFillMR)" stroke="#8a6cff" stroke-width="1.3"/>

      <!-- LIDAR mount -->
      <rect x="68" y="100" width="16" height="14" rx="3" fill="url(#navyFillMR)" stroke="#68e3ff" stroke-width="1.4"/>
      <ellipse cx="76" cy="100" rx="8" ry="3" fill="url(#navyFillMR)" stroke="#68e3ff" stroke-width="1.2"/>

      <!-- small coordinate axis triad at the LIDAR -->
      <g transform="translate(92,96)" stroke-width="1.3" stroke-linecap="round">
        <line x1="0" y1="0" x2="11" y2="0" stroke="#ff5d5d"/>
        <line x1="0" y1="0" x2="0" y2="-11" stroke="#4ee08a"/>
        <line x1="0" y1="0" x2="8" y2="8" stroke="#5b9dff"/>
      </g>
    </g>
  </g>
</svg>
