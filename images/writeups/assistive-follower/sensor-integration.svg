<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram showing a camera field of view cone aimed at a person's shoes and a wider LiDAR scan arc at the same origin">
  <defs>
    <linearGradient id="camCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#68e3ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#68e3ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="lidarArc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#45ddb0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#45ddb0" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- floor line -->
  <line x1="40" y1="360" x2="760" y2="360" stroke="#97a8d8" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- LiDAR wide scan arc, drawn first so camera cone sits above it -->
  <path d="M 150 300 L 60 120 A 260 260 0 0 1 500 60 L 150 300 Z" fill="url(#lidarArc)"/>
  <path d="M 60 120 A 260 260 0 0 1 500 60" fill="none" stroke="#45ddb0" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.8"/>
  <g stroke="#45ddb0" stroke-width="1" opacity="0.35">
    <line x1="150" y1="300" x2="110" y2="185"/>
    <line x1="150" y1="300" x2="230" y2="120"/>
    <line x1="150" y1="300" x2="330" y2="80"/>
    <line x1="150" y1="300" x2="430" y2="72"/>
  </g>

  <!-- camera narrow FOV cone, aimed down toward shoe level -->
  <path d="M 150 300 L 250 355 L 400 355 L 300 300 Z" fill="url(#camCone)"/>
  <path d="M 150 300 L 250 355 M 150 300 L 400 355" stroke="#68e3ff" stroke-width="2" opacity="0.85"/>

  <!-- robot origin marker -->
  <g transform="translate(150,300)">
    <rect x="-22" y="-14" width="44" height="28" rx="10" fill="#4f7cff" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#090a14" opacity="0.5"/>
  </g>

  <!-- camera icon at cone origin -->
  <g transform="translate(150,262)">
    <rect x="-13" y="-8" width="26" height="16" rx="3" fill="none" stroke="#68e3ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#68e3ff" stroke-width="2"/>
    <rect x="7" y="-11" width="6" height="4" rx="1" fill="#68e3ff"/>
  </g>
  <text x="150" y="238" text-anchor="middle" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="13" letter-spacing="0.04em">RGB-D</text>

  <!-- lidar icon -->
  <g transform="translate(60,150)">
    <circle cx="0" cy="0" r="9" fill="none" stroke="#45ddb0" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#45ddb0"/>
    <line x1="0" y1="-16" x2="0" y2="-9" stroke="#45ddb0" stroke-width="2"/>
    <line x1="11" y1="-11" x2="6" y2="-6" stroke="#45ddb0" stroke-width="2"/>
    <line x1="-11" y1="-11" x2="-6" y2="-6" stroke="#45ddb0" stroke-width="2"/>
  </g>
  <text x="60" y="188" text-anchor="middle" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="13" letter-spacing="0.04em">LiDAR</text>

  <!-- shoes / feet icon at the cone's terminus, floor level -->
  <g transform="translate(325,355)" fill="#c7cfe6" opacity="0.9">
    <ellipse cx="-14" cy="0" rx="16" ry="7" />
    <ellipse cx="16" cy="4" rx="16" ry="7" />
  </g>
  <text x="325" y="392" text-anchor="middle" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="13" letter-spacing="0.04em">Target user</text>
</svg>
