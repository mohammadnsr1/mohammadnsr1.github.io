<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A small wheeled robot follows a walking person through a room, its path curving around a chair">
  <defs>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#68e3ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#68e3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="robotBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#68e3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- floor plane, three quarter perspective -->
  <polygon points="60,420 740,420 620,300 180,300" fill="url(#floorFade)"/>
  <g stroke="#97a8d8" stroke-opacity="0.14" stroke-width="1">
    <line x1="180" y1="300" x2="60" y2="420"/>
    <line x1="620" y1="300" x2="740" y2="420"/>
    <line x1="280" y1="300" x2="205" y2="420"/>
    <line x1="380" y1="300" x2="350" y2="420"/>
    <line x1="480" y1="300" x2="495" y2="420"/>
    <line x1="580" y1="300" x2="640" y2="420"/>
    <line x1="220" y1="330" x2="600" y2="330"/>
    <line x1="200" y1="365" x2="630" y2="365"/>
  </g>

  <!-- trajectory: dotted path trailing the person, curving around the chair -->
  <path d="M 300 360 C 380 345, 430 300, 470 270 C 510 240, 470 205, 420 195"
        fill="none" stroke="#45ddb0" stroke-width="3" stroke-dasharray="2 12"
        stroke-linecap="round" opacity="0.85"/>

  <!-- chair obstacle -->
  <g transform="translate(486,235)" opacity="0.92">
    <rect x="-18" y="-6" width="36" height="8" rx="2" fill="#b4bfd9" opacity="0.55"/>
    <rect x="-18" y="-34" width="8" height="30" rx="2" fill="#b4bfd9" opacity="0.55"/>
    <rect x="10" y="-34" width="8" height="30" rx="2" fill="#b4bfd9" opacity="0.55"/>
    <rect x="-16" y="-46" width="32" height="14" rx="3" fill="#8f9ab8" opacity="0.6"/>
    <rect x="-14" y="2" width="4" height="16" fill="#b4bfd9" opacity="0.5"/>
    <rect x="12" y="2" width="4" height="16" fill="#b4bfd9" opacity="0.5"/>
  </g>

  <!-- walking person, simplified flat silhouette -->
  <g transform="translate(392,150)" fill="#c7cfe6" opacity="0.92">
    <circle cx="0" cy="-58" r="14"/>
    <path d="M -13 -42 C -13 -20, -10 5, -14 30 L -4 30 C -1 8, 2 -4, 6 -14 C 10 -4, 13 10, 16 30 L 26 30 C 21 2, 20 -20, 15 -42 C 6 -50, -5 -50, -13 -42 Z"/>
    <rect x="-15" y="30" width="9" height="30" rx="3" transform="rotate(-8 -10 30)"/>
    <rect x="9" y="30" width="9" height="30" rx="3" transform="rotate(10 14 30)"/>
  </g>

  <!-- small wheeled robot, trailing behind -->
  <g transform="translate(300,368)">
    <ellipse cx="0" cy="34" rx="46" ry="8" fill="#090a14" opacity="0.35"/>
    <rect x="-34" y="-8" width="68" height="34" rx="14" fill="url(#robotBody)" filter="url(#soft-glow)"/>
    <rect x="-20" y="-22" width="40" height="18" rx="8" fill="#45ddb0" opacity="0.85"/>
    <circle cx="0" cy="-16" r="4" fill="#090a14" opacity="0.5"/>
    <circle cx="-30" cy="20" r="9" fill="#8a6cff" opacity="0.8"/>
    <circle cx="30" cy="20" r="9" fill="#8a6cff" opacity="0.8"/>
  </g>
</svg>
