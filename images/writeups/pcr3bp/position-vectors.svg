<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the position vectors from the origin to the third body P and to each primary m1 and m2, drawn in the rotating frame">
  <defs>
    <marker id="pvArrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#45ddb0"/>
    </marker>
    <marker id="pvArrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68e3ff"/>
    </marker>
  </defs>

  <line x1="60" y1="300" x2="640" y2="300" stroke="#97a8d8" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.4"/>
  <line x1="350" y1="360" x2="350" y2="60" stroke="#97a8d8" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.4"/>

  <line x1="350" y1="300" x2="420" y2="120" stroke="#68e3ff" stroke-width="2.2" marker-end="url(#pvArrowCyan)"/>
  <text x="405" y="195" fill="#68e3ff" font-family="Manrope, sans-serif" font-size="14">r P/O</text>

  <line x1="350" y1="300" x2="205" y2="300" stroke="#45ddb0" stroke-width="2.2" marker-end="url(#pvArrowTeal)"/>
  <text x="245" y="320" fill="#45ddb0" font-family="Manrope, sans-serif" font-size="14">r m1/O</text>

  <line x1="350" y1="300" x2="460" y2="300" stroke="#45ddb0" stroke-width="2.2" marker-end="url(#pvArrowTeal)"/>
  <text x="385" y="320" fill="#45ddb0" font-family="Manrope, sans-serif" font-size="14">r m2/O</text>

  <circle cx="350" cy="300" r="3.5" fill="#c7cfe6"/>
  <text x="332" y="322" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="13">O</text>

  <circle cx="200" cy="300" r="8" fill="#4f7cff" opacity="0.85"/>
  <text x="200" y="330" text-anchor="middle" fill="#c7cfe6" font-family="Manrope, sans-serif" font-size="14">m1</text>

  <circle cx="460" cy="300" r="6" fill="#8a6cff" opacity="0.85"/>
  <text x="460" y="328" text-anchor="middle" fill="#c7cfe6" font-family="Manrope, sans-serif" font-size="14">m2</text>

  <circle cx="420" cy="120" r="4" fill="#ffb25e"/>
  <text x="420" y="105" text-anchor="middle" fill="#c7cfe6" font-family="Manrope, sans-serif" font-size="14">P</text>
</svg>
