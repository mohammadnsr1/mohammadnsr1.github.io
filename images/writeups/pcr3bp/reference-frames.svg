<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the inertial X, Y frame and the rotating x, y frame sharing the same origin, offset by the angle theta equal to omega t">
  <defs>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#97a8d8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#45ddb0"/>
    </marker>
  </defs>

  <line x1="240" y1="340" x2="500" y2="340" stroke="#97a8d8" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.55" marker-end="url(#arrowMuted)"/>
  <line x1="240" y1="340" x2="240" y2="80" stroke="#97a8d8" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.55" marker-end="url(#arrowMuted)"/>
  <text x="512" y="345" fill="#97a8d8" font-family="Manrope, sans-serif" font-size="16">X</text>
  <text x="226" y="68" fill="#97a8d8" font-family="Manrope, sans-serif" font-size="16">Y</text>

  <line x1="240" y1="340" x2="422" y2="235" stroke="#45ddb0" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
  <line x1="240" y1="340" x2="135" y2="158" stroke="#45ddb0" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
  <text x="432" y="228" fill="#45ddb0" font-family="Manrope, sans-serif" font-size="16">x</text>
  <text x="105" y="150" fill="#45ddb0" font-family="Manrope, sans-serif" font-size="16">y</text>

  <path d="M 280 340 A 40 40 0 0 0 275 320" fill="none" stroke="#68e3ff" stroke-width="1.5"/>
  <text x="288" y="313" fill="#68e3ff" font-family="Manrope, sans-serif" font-size="14">&#952; = &#969;t</text>

  <circle cx="240" cy="340" r="3.5" fill="#c7cfe6"/>
  <text x="220" y="362" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="13">O</text>
</svg>
