<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Free body diagram of the third body P showing the vectors r1 and r2 toward each primary m1 and m2">
  <defs>
    <marker id="fbdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68e3ff"/>
    </marker>
  </defs>

  <line x1="150" y1="320" x2="420" y2="140" stroke="#68e3ff" stroke-width="2.2" marker-end="url(#fbdArrow)"/>
  <text x="255" y="222" fill="#68e3ff" font-family="Manrope, sans-serif" font-size="15">r1</text>

  <line x1="560" y1="320" x2="420" y2="140" stroke="#68e3ff" stroke-width="2.2" marker-end="url(#fbdArrow)"/>
  <text x="510" y="222" fill="#68e3ff" font-family="Manrope, sans-serif" font-size="15">r2</text>

  <circle cx="150" cy="320" r="8" fill="#4f7cff" opacity="0.85"/>
  <text x="150" y="350" text-anchor="middle" fill="#c7cfe6" font-family="Manrope, sans-serif" font-size="14">m1</text>

  <circle cx="560" cy="320" r="6" fill="#8a6cff" opacity="0.85"/>
  <text x="560" y="348" text-anchor="middle" fill="#c7cfe6" font-family="Manrope, sans-serif" font-size="14">m2</text>

  <circle cx="420" cy="140" r="4" fill="#ffb25e"/>
  <text x="420" y="122" text-anchor="middle" fill="#c7cfe6" font-family="Manrope, sans-serif" font-size="14">P</text>
</svg>
