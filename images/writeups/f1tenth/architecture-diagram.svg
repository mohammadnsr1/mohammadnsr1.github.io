<svg viewBox="0 0 970 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram showing LIDAR and odometry feeding three parallel behaviors, emergency braking, PID wall following, and follow the gap, which each publish an Ackermann drive command to the car">
  <defs>
    <marker id="mAmberF1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb25e"/>
    </marker>
    <marker id="mTealF1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#45ddb0"/>
    </marker>
    <marker id="mVioletF1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6cff"/>
    </marker>
    <marker id="mBlueF1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f7cff"/>
    </marker>
    <marker id="mCyanF1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#68e3ff"/>
    </marker>
    <linearGradient id="nodeFillF1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a30" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0f1221" stop-opacity="0.94"/>
    </linearGradient>
  </defs>

  <!-- Odometry to Emergency Brake -->
  <line x1="180" y1="90" x2="248" y2="90" stroke="#4f7cff" stroke-width="2" marker-end="url(#mBlueF1)"/>

  <!-- LIDAR branches to all three behaviors -->
  <path d="M 180 200 L 220 200 L 220 90 L 248 90" fill="none" stroke="#4f7cff" stroke-width="2" marker-end="url(#mBlueF1)"/>
  <line x1="180" y1="200" x2="248" y2="200" stroke="#4f7cff" stroke-width="2" marker-end="url(#mBlueF1)"/>
  <path d="M 180 200 L 220 200 L 220 310 L 248 310" fill="none" stroke="#4f7cff" stroke-width="2" marker-end="url(#mBlueF1)"/>

  <!-- each behavior to Ackermann drive -->
  <path d="M 440 90 L 480 90 L 480 200 L 518 200" fill="none" stroke="#ffb25e" stroke-width="2" marker-end="url(#mAmberF1)"/>
  <line x1="440" y1="200" x2="518" y2="200" stroke="#45ddb0" stroke-width="2" marker-end="url(#mTealF1)"/>
  <path d="M 440 310 L 480 310 L 480 200 L 518 200" fill="none" stroke="#8a6cff" stroke-width="2" marker-end="url(#mVioletF1)"/>

  <!-- Ackermann drive to real car -->
  <line x1="700" y1="200" x2="758" y2="200" stroke="#68e3ff" stroke-width="2" marker-end="url(#mCyanF1)"/>

  <!-- node: Odometry -->
  <g transform="translate(30,60)">
    <rect width="150" height="60" rx="14" fill="url(#nodeFillF1)" stroke="#4f7cff" stroke-width="1.5"/>
    <text x="75" y="30" text-anchor="middle" fill="#e7ebf7" font-family="Manrope, sans-serif" font-size="14" font-weight="600">Odometry</text>
    <text x="75" y="47" text-anchor="middle" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="11">car velocity</text>
  </g>

  <!-- node: LIDAR -->
  <g transform="translate(30,170)">
    <rect width="150" height="60" rx="14" fill="url(#nodeFillF1)" stroke="#4f7cff" stroke-width="1.5"/>
    <text x="75" y="30" text-anchor="middle" fill="#e7ebf7" font-family="Manrope, sans-serif" font-size="14" font-weight="600">LiDAR</text>
    <text x="75" y="47" text-anchor="middle" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="11">shared by all three</text>
  </g>

  <!-- node: Emergency Brake -->
  <g transform="translate(250,60)">
    <rect width="190" height="60" rx="14" fill="url(#nodeFillF1)" stroke="#ffb25e" stroke-width="1.5"/>
    <text x="95" y="30" text-anchor="middle" fill="#e7ebf7" font-family="Manrope, sans-serif" font-size="13" font-weight="600">Emergency Brake</text>
    <text x="95" y="47" text-anchor="middle" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="11">time to collision</text>
  </g>

  <!-- node: Wall Follow -->
  <g transform="translate(250,170)">
    <rect width="190" height="60" rx="14" fill="url(#nodeFillF1)" stroke="#45ddb0" stroke-width="1.5"/>
    <text x="95" y="30" text-anchor="middle" fill="#e7ebf7" font-family="Manrope, sans-serif" font-size="14" font-weight="600">Wall Follow</text>
    <text x="95" y="47" text-anchor="middle" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="11">PID on wall distance</text>
  </g>

  <!-- node: Follow the Gap -->
  <g transform="translate(250,280)">
    <rect width="190" height="60" rx="14" fill="url(#nodeFillF1)" stroke="#8a6cff" stroke-width="1.5"/>
    <text x="95" y="30" text-anchor="middle" fill="#e7ebf7" font-family="Manrope, sans-serif" font-size="14" font-weight="600">Follow the Gap</text>
    <text x="95" y="47" text-anchor="middle" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="11">widest free space</text>
  </g>

  <!-- node: Ackermann Drive -->
  <g transform="translate(520,170)">
    <rect width="180" height="60" rx="14" fill="url(#nodeFillF1)" stroke="#68e3ff" stroke-width="1.5"/>
    <text x="90" y="30" text-anchor="middle" fill="#e7ebf7" font-family="Manrope, sans-serif" font-size="13" font-weight="600">Ackermann Drive</text>
    <text x="90" y="47" text-anchor="middle" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="11">steering and speed</text>
  </g>

  <!-- node: Real Car / VESC -->
  <g transform="translate(760,170)">
    <rect width="170" height="60" rx="14" fill="url(#nodeFillF1)" stroke="#68e3ff" stroke-width="1.5"/>
    <text x="85" y="30" text-anchor="middle" fill="#e7ebf7" font-family="Manrope, sans-serif" font-size="13" font-weight="600">Car or Simulator</text>
    <text x="85" y="47" text-anchor="middle" fill="#8f9ab8" font-family="Manrope, sans-serif" font-size="11">VESC or RViz/Gazebo</text>
  </g>
</svg>
